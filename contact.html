<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Wonder Pet</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="contact-hero">
    <div class="contact-hero-content">
      <h1>Get In Touch</h1>
      <p>We are here to answer any questions you may have about our services, bookings, or pet care needs.</p>
    </div>
  </section>

  <section class="contact-details-and-form">
    <div class="contact-info">
      <h2>Contact Information</h2>
      <div class="info-item">
        <span class="icon">📍</span>
        <p>123 Pet Care Lane, Suite A<br>Pawfect City, WP 54321</p>
      </div>
      <div class="info-item">
        <span class="icon">📞</span>
        <p>(555) 123-4567</p>
      </div>
      <div class="info-item">
        <span class="icon">✉️</span>
        <p>pawfectgroomingph@gmail.com</p>
      </div>
      <div class="info-item">
        <span class="icon">⏰</span>
        <p>Mon - Sun: 8:00 AM - 6:00 PM</p>
      </div>
    </div>
    
    <div class="contact-form-container">
      <h2>Send Us a Message</h2>
      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group full-width">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required>
        </div>
        <div class="form-group full-width">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <script src="layout.js"></script>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Stop page reload

        // 1. Collect Data
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            subject: document.getElementById('subject').value,
            message: document.getElementById('message').value
        };

        const submitBtn = this.querySelector('.submit-btn');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Sending...';
        submitBtn.disabled = true;

        try {
            // 2. Send to API
            const response = await fetch('contact_api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            // 3. Handle Result
            if (result.status === 'success') {
                alert('✓ ' + result.message);
                document.getElementById('contactForm').reset(); // Clear inputs
            } else {
                alert('✗ Error: ' + (result.message || 'Failed to send message'));
            }

        } catch (error) {
            console.error('Error:', error);
            alert('✗ Connection error. Please check your internet.');
        } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });
  </script>
</body>
</html>
